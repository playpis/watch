<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Market Watch</title>

  <style>
    body {
      margin: 0;
      font-family: -apple-system;
      background: #000;
      color: #fff;
      display: flex;
      justify-content: center;
      padding-top: 20px;
    }

    .container {
      width: 90%;
      max-width: 320px;
    }

    .card {
      background: #111;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 0 12px rgba(255,255,255,0.04);
    }

    .label {
      font-size: 12px;
      color: #aaa;
    }

    .price {
      font-size: 28px;
      font-weight: bold;
      margin-top: 6px;
    }

    .change {
      font-size: 14px;
      margin-top: 6px;
    }

    .up {
      color: #00ff88;
    }

    .down {
      color: #ff4d4f;
    }

    .footer {
      font-size: 11px;
      color: #666;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">
    <div class="label">Bitcoin</div>
    <div class="price" id="btc-price">$--</div>
    <div class="change" id="btc-change">--</div>
  </div>

  <div class="card">
    <div class="label">Tether Gold (XAUT)</div>
    <div class="price" id="gold-price">$--</div>
    <div class="change" id="gold-change">--</div>
  </div>

  <div class="footer" id="update-time">
    Loading...
  </div>

</div>

<script>
async function loadData() {
  try {
    const res = await fetch("/api/price");
    const data = await res.json();

    updateCard("btc", data.btc, data.btc_24h);
    updateCard("gold", data.gold, data.gold_24h);

    document.getElementById("update-time").innerText =
      "Updated: " + new Date().toLocaleTimeString();

  } catch (e) {
    document.getElementById("update-time").innerText =
      "Update failed";
  }
}

function updateCard(id, price, change) {
  document.getElementById(id + "-price").innerText =
    "$" + price;

  const el = document.getElementById(id + "-change");

  const isUp = Number(change) >= 0;

  el.innerText =
    (isUp ? "+" : "") + change + "% (24h)";

  el.className =
    "change " + (isUp ? "up" : "down");
}

loadData();

/* 5分钟刷新一次（适合 Vercel 免费版） */
setInterval(loadData, 300000);
</script>

</body>
</html>
