<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watch</title>

  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: -apple-system;
      display: flex;
      justify-content: center;
      padding: 18px 0;
    }

    .container {
      width: 92%;
      max-width: 360px;
    }

    .card {
      background: #111;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 10px;
    }

    .label {
      font-size: 11px;
      color: #888;
      margin-bottom: 4px;
    }

    .value {
      font-size: 26px;
      font-weight: bold;
    }

    .sub {
      font-size: 12px;
      margin-top: 4px;
      min-height: 14px;
      color: #aaa;
    }

    .signal {
      font-size: 18px;
      font-weight: 700;
    }

    .green {
      color: #00ff88;
    }

    .red {
      color: #ff4d4f;
    }

    .gray {
      color: #aaa;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- SIGNAL -->
  <div class="card">
    <div class="label">Signal</div>
    <div class="signal" id="signal">--</div>
    <div class="sub" id="signal-desc">loading...</div>
  </div>

  <!-- BTC -->
  <div class="card">
    <div class="label">BTC</div>
    <div class="value" id="btc">$--</div>
    <div class="sub" id="btc-change"></div>
  </div>

  <!-- XAUT -->
  <div class="card">
    <div class="label">XAUT</div>
    <div class="value" id="gold">$--</div>
    <div class="sub" id="gold-change"></div>
  </div>

  <!-- DXY -->
  <div class="card">
    <div class="label">DXY</div>
    <div class="value" id="dxy">--</div>
    <div class="sub" id="dxy-change"></div>
  </div>

  <!-- TLT -->
  <div class="card">
    <div class="label">TLT</div>
    <div class="value" id="tlt">--</div>
    <div class="sub" id="tlt-change"></div>
  </div>

</div>

<script>
function setSignal(btcChg, dxyChg, tltChg) {
  const el = document.getElementById("signal");
  const desc = document.getElementById("signal-desc");

  let score = 0;

  // BTC上涨 = 风险偏好增强
  if (btcChg > 0) score++;
  else score--;

  // DXY下跌 = 风险偏好增强
  if (dxyChg < 0) score++;
  else score--;

  // TLT上涨 = 利率下降 = 风险偏好增强
  if (tltChg > 0) score++;
  else score--;

  if (score >= 2) {
    el.innerText = "🟢 Risk-On";
    el.className = "signal green";
    desc.innerText = "Risk assets favored";
  } else if (score <= -2) {
    el.innerText = "🔴 Risk-Off";
    el.className = "signal red";
    desc.innerText = "Defensive mode";
  } else {
    el.innerText = "⚪ Neutral";
    el.className = "signal gray";
    desc.innerText = "No clear trend";
  }
}

async function load() {
  try {
    const r = await fetch("/api/market");
    const d = await r.json();

    const btcChg = Number(d.btc_change || 0);
    const goldChg = Number(d.gold_change || 0);
    const dxyChg = Number(d.dxy_change || 0);
    const tltChg = Number(d.tlt_change || 0);

    // BTC
    document.getElementById("btc").innerText =
      "$" + d.btc;

    document.getElementById("btc-change").innerText =
      (btcChg >= 0 ? "+" : "") +
      btcChg.toFixed(2) + "% (24h)";

    document.getElementById("btc-change").style.color =
      btcChg >= 0 ? "#00ff88" : "#ff4d4f";

    // XAUT
    document.getElementById("gold").innerText =
      "$" + d.gold;

    document.getElementById("gold-change").innerText =
      (goldChg >= 0 ? "+" : "") +
      goldChg.toFixed(2) + "% (24h)";

    document.getElementById("gold-change").style.color =
      goldChg >= 0 ? "#00ff88" : "#ff4d4f";

    // DXY（真实趋势）
    document.getElementById("dxy").innerText =
      d.dxy;

    document.getElementById("dxy-change").innerText =
      "1D Trend: " +
      (dxyChg >= 0 ? "+" : "") +
      dxyChg.toFixed(2);

    // DXY上涨 = 偏空 → 红
    document.getElementById("dxy-change").style.color =
      dxyChg >= 0 ? "#ff4d4f" : "#00ff88";

    // TLT（真实趋势）
    document.getElementById("tlt").innerText =
      d.tlt;

    document.getElementById("tlt-change").innerText =
      "1D Trend: " +
      (tltChg >= 0 ? "+" : "") +
      tltChg.toFixed(2);

    // TLT上涨 = 偏多 → 绿
    document.getElementById("tlt-change").style.color =
      tltChg >= 0 ? "#00ff88" : "#ff4d4f";

    // SIGNAL
    setSignal(
      btcChg,
      dxyChg,
      tltChg
    );

  } catch (e) {
    document.getElementById("signal").innerText = "ERROR";
    document.getElementById("signal-desc").innerText =
      "data fetch failed";
  }
}

load();
setInterval(load, 300000);
</script>

</body>
</html>
