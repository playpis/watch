<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watch</title>

  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: -apple-system;
      display: flex;
      justify-content: center;
      padding: 20px 0;
    }

    .container {
      width: 92%;
      max-width: 360px;
    }

    .card {
      background: #111;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 10px;
    }

    .label {
      font-size: 11px;
      color: #888;
    }

    .value {
      font-size: 26px;
      font-weight: bold;
      margin-top: 4px;
    }

    .sub {
      font-size: 12px;
      margin-top: 4px;
      color: #aaa;
    }

    .signal {
      font-size: 18px;
      font-weight: bold;
    }

    .green { color: #00ff88; }
    .red { color: #ff4d4f; }
    .gray { color: #aaa; }
  </style>
</head>

<body>

<div class="container">

  <!-- SIGNAL -->
  <div class="card">
    <div class="label">Signal</div>
    <div class="signal" id="signal">--</div>
    <div class="sub" id="signal-desc">loading...</div>
  </div>

  <!-- BTC -->
  <div class="card">
    <div class="label">BTC</div>
    <div class="value" id="btc">$--</div>
    <div class="sub" id="btc-change">--</div>
  </div>

  <!-- XAUT -->
  <div class="card">
    <div class="label">XAUT</div>
    <div class="value" id="gold">$--</div>
    <div class="sub" id="gold-change">--</div>
  </div>

  <!-- DXY -->
  <div class="card">
    <div class="label">DXY</div>
    <div class="value" id="dxy">--</div>
  </div>

  <!-- TLT -->
  <div class="card">
    <div class="label">TLT (Rate Proxy)</div>
    <div class="value" id="tlt">--</div>
  </div>

</div>

<script>
function setSignal(btcChg, dxy, tlt) {
  const el = document.getElementById("signal");
  const desc = document.getElementById("signal-desc");

  let score = 0;

  if (btcChg > 0) score++;
  else score--;

  if (dxy < 100) score++;   // 简化：美元弱=风险偏好
  else score--;

  if (tlt > 0) score++;
  else score--;

  if (score >= 2) {
    el.innerText = "🟢 Risk-On";
    el.className = "signal green";
    desc.innerText = "Risk assets favored";
  } else if (score <= -2) {
    el.innerText = "🔴 Risk-Off";
    el.className = "signal red";
    desc.innerText = "Defensive mode";
  } else {
    el.innerText = "⚪ Neutral";
    el.className = "signal gray";
    desc.innerText = "No clear trend";
  }
}

async function load() {
  const r = await fetch("/api/market");
  const d = await r.json();

  // BTC
  document.getElementById("btc").innerText = "$" + d.btc;
  const btcChg = Number(d.btc_change || 0);
  document.getElementById("btc-change").innerText =
    (btcChg >= 0 ? "+" : "") + btcChg.toFixed(2) + "% (24h)";

  document.getElementById("btc-change").style.color =
    btcChg >= 0 ? "#00ff88" : "#ff4d4f";

  // XAUT
  document.getElementById("gold").innerText = "$" + d.gold;
  const goldChg = Number(d.gold_change || 0);
  document.getElementById("gold-change").innerText =
    (goldChg >= 0 ? "+" : "") + goldChg.toFixed(2) + "% (24h)";

  document.getElementById("gold-change").style.color =
    goldChg >= 0 ? "#00ff88" : "#ff4d4f";

  // DXY
  document.getElementById("dxy").innerText = d.dxy;

  // TLT
  document.getElementById("tlt").innerText = d.tlt;

  setSignal(
    btcChg,
    Number(d.dxy),
    Number(d.tlt)
  );
}

load();
setInterval(load, 300000);
</script>

</body>
</html>
