<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Macro Watch</title>

  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: -apple-system;
      display: flex;
      justify-content: center;
      padding: 20px 0;
    }

    .container {
      width: 90%;
      max-width: 360px;
    }

    .title {
      text-align: center;
      font-size: 18px;
      margin-bottom: 16px;
      color: #ddd;
    }

    .card {
      background: #111;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 0 10px rgba(255,255,255,0.04);
    }

    .label {
      font-size: 12px;
      color: #999;
    }

    .value {
      font-size: 28px;
      font-weight: bold;
      margin-top: 6px;
    }

    .footer {
      text-align: center;
      font-size: 11px;
      color: #666;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="title">
    📊 Macro Watch
  </div>

  <div class="card">
    <div class="label">Bitcoin (BTC)</div>
    <div class="value" id="btc">$--</div>
  </div>

  <div class="card">
    <div class="label">Tether Gold (XAUT)</div>
    <div class="value" id="gold">$--</div>
  </div>

  <div class="card">
    <div class="label">US Dollar Index (DXY)</div>
    <div class="value" id="dxy">--</div>
  </div>

  <div class="card">
    <div class="label">US10Y Treasury Yield</div>
    <div class="value" id="us10y">--%</div>
  </div>

  <div class="footer" id="time">
    Loading...
  </div>

</div>

<script>
async function loadData() {
  try {
    const res = await fetch("/api/market");
    const data = await res.json();

    document.getElementById("btc").innerText =
      "$" + data.btc;

    document.getElementById("gold").innerText =
      "$" + data.gold;

    document.getElementById("dxy").innerText =
      data.dxy;

    document.getElementById("us10y").innerText =
      data.us10y + "%";

    document.getElementById("time").innerText =
      "Updated: " + new Date().toLocaleTimeString();

  } catch (e) {
    document.getElementById("time").innerText =
      "Update failed";
  }
}

loadData();

/* 每5分钟刷新 */
setInterval(loadData, 300000);
</script>

</body>
</html>
