<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watch</title>

  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: -apple-system;
      display: flex;
      justify-content: center;
      padding: 12px;
    }

    .container {
      width: 100%;
      max-width: 360px;
    }

    .card {
      background: #111;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 8px;
    }

    .text {
      font-size: 18px;
      font-weight: 600;
      white-space: nowrap;
    }

    .signal {
      font-size: 18px;
      font-weight: 700;
    }

    .green { color: #00ff88; }
    .red { color: #ff4d4f; }
    .gray { color: #aaa; }
  </style>
</head>

<body>

<div class="container">

  <div class="card">
    <div class="signal" id="signal">Loading...</div>
  </div>

  <div class="card">
    <div class="text" id="btc">BTC --</div>
  </div>

  <div class="card">
    <div class="text" id="gold">XAUT --</div>
  </div>

  <div class="card">
    <div class="text" id="dxy">DXY --</div>
  </div>

  <div class="card">
    <div class="text" id="tlt">TLT --</div>
  </div>

</div>

<script>
function setSignal(btcChg, dxy, tlt) {
  const el = document.getElementById("signal");

  let score = 0;

  if (btcChg > 0) score++;
  else score--;

  if (dxy < 100) score++;
  else score--;

  if (tlt > 0) score++;
  else score--;

  if (score >= 2) {
    el.innerText = "🟢 RISK-ON";
    el.className = "signal green";
  } else if (score <= -2) {
    el.innerText = "🔴 RISK-OFF";
    el.className = "signal red";
  } else {
    el.innerText = "⚪ NEUTRAL";
    el.className = "signal gray";
  }
}

async function load() {
  try {
    const r = await fetch("/api/market");
    const d = await r.json();

    const btcChg = Number(d.btc_change || 0);
    const goldChg = Number(d.gold_change || 0);

    document.getElementById("btc").innerText =
      `BTC $${d.btc} ${btcChg.toFixed(2)}%`;

    document.getElementById("gold").innerText =
      `XAUT $${d.gold} ${goldChg.toFixed(2)}%`;

    document.getElementById("dxy").innerText =
      `DXY ${d.dxy}`;

    document.getElementById("tlt").innerText =
      `TLT ${d.tlt}`;

    setSignal(
      btcChg,
      Number(d.dxy),
      Number(d.tlt)
    );

  } catch {
    document.getElementById("signal").innerText = "ERROR";
  }
}

load();
setInterval(load, 300000);
</script>

</body>
</html>
