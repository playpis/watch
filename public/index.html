<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Macro Watch</title>

  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: -apple-system;
      display: flex;
      justify-content: center;
      padding: 20px 0;
    }

    .container {
      width: 90%;
      max-width: 360px;
    }

    .title {
      text-align: center;
      font-size: 18px;
      margin-bottom: 16px;
      color: #ddd;
    }

    .card {
      background: #111;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .label {
      font-size: 12px;
      color: #999;
    }

    .value {
      font-size: 28px;
      font-weight: bold;
      margin-top: 6px;
    }

    .sub {
      font-size: 12px;
      color: #666;
      margin-top: 4px;
    }

    .footer {
      text-align: center;
      font-size: 11px;
      color: #666;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="title">📊 Macro Watch</div>

  <div class="card">
    <div class="label">BTC</div>
    <div class="value" id="btc">$--</div>
    <div class="sub" id="btc-change">--</div>
  </div>

  <div class="card">
    <div class="label">XAUT (Gold Token)</div>
    <div class="value" id="gold">$--</div>
    <div class="sub" id="gold-change">--</div>
  </div>

  <div class="card">
    <div class="label">DXY (UUP Proxy)</div>
    <div class="value" id="dxy">--</div>
  </div>

  <div class="card">
    <div class="label">US10Y Yield</div>
    <div class="value" id="us10y">--%</div>
  </div>

  <div class="footer" id="time">Loading...</div>

</div>

<script>
function setChange(id, val) {
  const el = document.getElementById(id);
  const n = Number(val || 0);
  const sign = n >= 0 ? "+" : "";
  el.innerText = `${sign}${n.toFixed(2)}% (24h)`;
}

async function loadData() {
  try {
    const res = await fetch("/api/market");
    const data = await res.json();

    document.getElementById("btc").innerText = "$" + data.btc;
    document.getElementById("gold").innerText = "$" + data.gold;
    document.getElementById("dxy").innerText = data.dxy;
    document.getElementById("us10y").innerText = data.us10y;

    setChange("btc-change", data.btc_change);
    setChange("gold-change", data.gold_change);

    document.getElementById("time").innerText =
      "Updated: " + new Date().toLocaleTimeString();

  } catch (e) {
    document.getElementById("time").innerText = "Update failed";
  }
}

loadData();
setInterval(loadData, 300000);
</script>

</body>
</html>
