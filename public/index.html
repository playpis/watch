<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watch</title>

  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: -apple-system;
      display: flex;
      justify-content: center;
      padding: 20px 0;
    }

    .container {
      width: 92%;
      max-width: 360px;
    }

    .card {
      background: #111;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 10px;
    }

    .label {
      font-size: 11px;
      color: #888;
    }

    .value {
      font-size: 26px;
      font-weight: bold;
      margin-top: 4px;
    }

    .signal {
      font-size: 18px;
      font-weight: bold;
      margin-top: 6px;
    }

    .green { color: #00ff88; }
    .red { color: #ff4d4f; }
    .gray { color: #aaa; }

    .sub {
      font-size: 12px;
      color: #666;
      margin-top: 4px;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- SIGNAL -->
  <div class="card">
    <div class="label">Signal</div>
    <div class="signal" id="signal">--</div>
    <div class="sub" id="signal-desc">loading...</div>
  </div>

  <!-- BTC -->
  <div class="card">
    <div class="label">BTC</div>
    <div class="value" id="btc">$--</div>
    <div class="sub" id="btc-change">--</div>
  </div>

  <!-- GOLD -->
  <div class="card">
    <div class="label">XAUT</div>
    <div class="value" id="gold">$--</div>
    <div class="sub" id="gold-change">--</div>
  </div>

  <!-- DXY -->
  <div class="card">
    <div class="label">DXY</div>
    <div class="value" id="dxy">--</div>
  </div>

  <!-- TLT -->
  <div class="card">
    <div class="label">TLT (Rate Proxy)</div>
    <div class="value" id="tlt">--</div>
  </div>

</div>

<script>
function setSignal(btc, dxy, tlt) {
  const el = document.getElementById("signal");
  const desc = document.getElementById("signal-desc");

  let score = 0;

  if (btc > 0) score += 1;
  else score -= 1;

  if (dxy < 0) score += 1;
  else score -= 1;

  if (tlt > 0) score += 1;
  else score -= 1;

  if (score >= 2) {
    el.innerText = "🟢 Risk-On";
    el.className = "signal green";
    desc.innerText = "Risk assets favored";
  } else if (score <= -2) {
    el.innerText = "🔴 Risk-Off";
    el.className = "signal red";
    desc.innerText = "Defensive mode";
  } else {
    el.innerText = "⚪ Neutral";
    el.className = "signal gray";
    desc.innerText = "No clear trend";
  }
}

async function load() {
  const r = await fetch("/api/market");
  const d = await r.json();

  document.getElementById("btc").innerText = "$" + d.btc;
  document.getElementById("gold").innerText = "$" + d.gold;
  document.getElementById("dxy").innerText = d.dxy;
  document.getElementById("tlt").innerText = d.us10y;

  setSignal(
    d.btc_change,
    -Number(d.dxy),     // DXY反向
    Number(d.us10y)     // TLT
  );
}

load();
setInterval(load, 300000);
</script>

</body>
</html>
